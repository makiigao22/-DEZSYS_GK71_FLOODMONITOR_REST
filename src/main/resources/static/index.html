<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FloodMonitor Dashboard</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;color:#1c2b3a;margin:0;padding:30px}main{max-width:1200px;margin:auto}h1{color:#134d79}section{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #ddd;margin-bottom:16px}label{display:inline-block;margin:6px}select,input,button{padding:9px;border:1px solid #ccd5df;border-radius:6px}button{background:#135c8d;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e4eaf0;text-align:left;padding:10px}th{background:#eaf1f7}.NORMAL{color:#198754;font-weight:bold}.WARNING{color:#d97706;font-weight:bold}.CRITICAL{color:#d12626;font-weight:bold}.UNKNOWN{color:#777;font-weight:bold}#error{color:#b91c1c}#loading{color:#2460a0}</style></head><body><main><h1>🌊 FloodMonitor – Hochwasserüberwachung</h1><section><label>Station <select id="station"></select></label><label>Format <select id="format"><option value="json">JSON</option><option value="xml">XML</option></select></label><label>Warnstufe <select id="level"><option value="">Alle</option><option>NORMAL</option><option>WARNING</option><option>CRITICAL</option><option>UNKNOWN</option></select></label><label>Von <input id="from" type="datetime-local"></label><label>Bis <input id="to" type="datetime-local"></label><button id="reload">Aktualisieren</button><p id="loading"></p><p id="error" role="alert"></p></section><section><h2>Aktuelle Messung</h2><div id="latest">Lade ...</div></section><section><h2>Messverlauf</h2><div style="overflow-x:auto"><table><thead><tr><th>Station</th><th>Zeitpunkt</th><th>Wasserstand (cm)</th><th>Durchfluss (m³/s)</th><th>Niederschlag (mm/h)</th><th>Akku (%)</th><th>Status</th><th>Warnstufe</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script>
const root='/api/v1';const names={};function safe(s){return $('<div>').text(s??'').html()}function parse(data,xml){if(!xml)return data;const obj=n=>{const o={};$(n).children().each(function(){if(!this.children.length)o[this.nodeName]=this.textContent;else o[this.nodeName]=obj(this)});return o};const top=data.documentElement;if(['ArrayList','List','Stations','Measurements'].includes(top.nodeName)||$(top).children().length&&$(top).children().first().children().length)return $(top).children().map(function(){return obj(this)}).get();return obj(top)}
function req(url){let xml=$('#format').val()==='xml';return $.ajax({url,headers:{Accept:xml?'application/xml':'application/json'}}).then(d=>parse(d,xml))}
function error(e){$('#error').text('Fehler: '+(e.responseJSON?.message||e.statusText||'Server nicht erreichbar'))}function date(v){return v?new Date(v).toISOString():null}
function render(m){return `<tr><td>${safe(names[m.stationId]||m.stationId)}</td><td>${safe(m.timestamp)}</td><td>${safe(m.waterLevel)}</td><td>${safe(m.flowRate)}</td><td>${safe(m.rainfall)}</td><td>${safe(m.batteryLevel)}</td><td>${safe(m.status)}</td><td class="${safe(m.warningLevel)}">${safe(m.warningLevel)}</td></tr>`}
function load(){let id=$('#station').val();if(!id)return;$('#loading').text('Lade Messwerte ...');$('#error').text('');let p=new URLSearchParams({limit:100});try{if($('#from').val())p.set('from',date($('#from').val()));if($('#to').val())p.set('to',date($('#to').val()))}catch(e){$('#loading').text('');$('#error').text('Ungültiges Datum');return}if($('#level').val())p.set('warningLevel',$('#level').val());$.when(req(`${root}/stations/${id}/measurements/latest`),req(`${root}/stations/${id}/measurements?${p}`)).done((latest,history)=>{$('#latest').html(`<strong>${safe(names[id])}</strong>: ${safe(latest.waterLevel)} cm – <span class="${safe(latest.warningLevel)}">${safe(latest.warningLevel)}</span>`);$('#rows').html((Array.isArray(history)?history:[history]).map(render).join('')||'<tr><td colspan="8">Keine Messwerte vorhanden</td></tr>')}).fail(error).always(()=>$('#loading').text(''))}
function stations(){req(`${root}/stations`).done(data=>{let list=Array.isArray(data)?data:[data];let old=$('#station').val();$('#station').empty();list.forEach(s=>{names[s.id]=s.name;$('#station').append($('<option>').val(s.id).text(s.name+' ('+s.river+')'))});if(old)$('#station').val(old);load()}).fail(error)}$('#reload').on('click',load);$('#station,#level').on('change',load);$('#format').on('change',stations);$('#from,#to').on('change',load);stations();setInterval(load,10000);
</script></body></html>
